name: 💡 Feature Request
description: Propose a new feature, analyzer, or capability for CyberGuard
labels: ["kind/feature", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas that make CyberGuard more effective, faster, and easier to use!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or missing security capability?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: Describe your proposed solution or how the feature should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution Intent
      options:
        - label: I am willing to submit a pull request implementing this feature under Apache 2.0 with DCO sign-off.
