name: DCO, Rust CI & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco-check:
    name: Check Developer Certificate of Origin (DCO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate DCO Sign-off
        run: |
          echo "Verifying all commits contain 'Signed-off-by:'..."
          FAILED=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git log --no-merges --format="%H" "$BASE_SHA..$HEAD_SHA")
          else
            COMMITS=$(git log -n 10 --no-merges --format="%H")
          fi

          for commit in $COMMITS; do
            SIG=$(git log -n 1 --format="%B" "$commit" | grep -E "^Signed-off-by: .+ <.+@.+>$" || true)
            if [ -z "$SIG" ]; then
              echo "❌ Commit $commit is missing valid 'Signed-off-by:' sign-off!"
              echo "   Run: git commit --amend -s"
              FAILED=1
            else
              echo "✅ Commit $commit properly signed: $SIG"
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "ERROR: DCO check failed. Every commit must be signed with 'git commit -s'."
            exit 1
          fi

  rust-quality-gate:
    name: Rust Workspace Test, Clippy & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose
